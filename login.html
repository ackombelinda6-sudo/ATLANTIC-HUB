<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Great Atlantic Hall</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-light) 100%);
    }
    .login-header {
      padding: 20px;
      text-align: center;
      color: white;
    }
    .login-header .logo-circle {
      margin: 0 auto 12px;
      width: 60px;
      height: 60px;
      font-size: 22px;
    }
    .login-header h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .login-header p {
      font-size: 13px;
      opacity: 0.9;
    }
    .login-card {
      flex: 1;
      background: white;
      border-radius: 28px 28px 0 0;
      padding: 30px 22px;
      margin-top: auto;
    }
    .login-card h2 {
      font-size: 20px;
      color: var(--blue-dark);
      margin-bottom: 6px;
    }
    .login-card > p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--blue-dark);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 13px 15px;
      border: 2px solid #e4e7ec;
      border-radius: 12px;
      font-size: 15px;
      transition: border 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--blue);
    }
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .submit-btn:active {
      background: var(--blue-dark);
    }
    .alt-link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }
    .alt-link a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-page">
    <div class="login-header">
      <div class="logo-circle">GA</div>
      <h1>Great Atlantic Hall</h1>
      <p>University of Cape Coast</p>
    </div>

    <div class="login-card">
      <a href="index.html" class="back-link">← Back to Home</a>

      <h2>Welcome back, Mariners 👋</h2>
      <p>Log in to access deals, marketplace, and more.</p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Student Email</label>
          <input type="email" placeholder="you@stu.ucc.edu.gh" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <p class="alt-link">
        Don't have an account? <a href="#">Sign up</a>
      </p>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      alert("Login feature coming soon! 🚧\n\nNext phase: we'll connect this to a real database.");
    }
  </script>

</body>
</html>
