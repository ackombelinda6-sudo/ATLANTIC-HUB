<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy & Sell | Great Atlantic Hall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <a href="index.html">←</a>
    <h1>🛒 Buy & Sell</h1>
  </header>

  <main class="page-body">
    <input type="text" class="search-bar" id="searchBar" placeholder="Search textbooks, electronics, food...">

    <div id="listings"></div>
  </main>

  <!-- Floating Add Button -->
  <button class="fab" onclick="openModal()">＋</button>

  <!-- Modal Form -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3>Post an Item for Sale</h3>

      <form onsubmit="addItem(event)">
        <div class="form-group">
          <label>Item name</label>
          <input type="text" id="itemName" required placeholder="e.g., Calculus Textbook">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="itemDesc" rows="2" required placeholder="Condition, details..."></textarea>
        </div>

        <div class="form-group">
          <label>Price (GH₵)</label>
          <input type="number" id="itemPrice" required min="0" placeholder="e.g., 80">
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="itemCategory">
            <option>Books</option>
            <option>Electronics</option>
            <option>Food</option>
            <option>Furniture</option>
            <option>Clothing</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Your contact (phone or room #)</label>
          <input type="text" id="itemContact" required placeholder="e.g., Room B12 / 0551234567">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-primary">Post Item</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Default items shown on first visit
    const DEFAULT_ITEMS = [
      { id: 1, name: "Calculus Textbook (Stewart 8th Ed.)", desc: "Gently used, no missing pages. Perfect for MTH101.", price: 80, category: "Books", contact: "Room A12" },
      { id: 2, name: "Electric Kettle (1.7L)", desc: "Brand new, still in box.", price: 120, category: "Electronics", contact: "0551234567" },
      { id: 3, name: "Indomie (Carton)", desc: "Chicken flavor. Ideal for late-night study sessions.", price: 65, category: "Food", contact: "Room C4" },
      { id: 4, name: "Desk Lamp (LED)", desc: "Rechargeable, 3 brightness levels.", price: 45, category: "Electronics", contact: "Room B7" }
    ];

    // Load items from localStorage, or use defaults
    let items = JSON.parse(localStorage.getItem("ga_marketplace")) || DEFAULT_ITEMS;

    function save() {
      localStorage.setItem("ga_marketplace", JSON.stringify(items));
    }

    function render(filter = "") {
      const container = document.getElementById("listings");
      const q = filter.toLowerCase();

      const visible = items.filter(i =>
        i.name.toLowerCase().includes(q) ||
        i.desc.toLowerCase().includes(q) ||
        i.category.toLowerCase().includes(q)
      );

      if (visible.length === 0) {
        container.innerHTML = `<div class="empty-state">No items found. Tap ＋ to post one!</div>`;
        return;
      }

      container.innerHTML = visible.map(item => `
        <div class="list-item">
          <button class="delete-btn" onclick="deleteItem(${item.id})">✕</button>
          <h4>${escapeHtml(item.name)}</h4>
          <p>${escapeHtml(item.desc)}</p>
          <p style="font-size:12px;color:#667085;">📍 ${escapeHtml(item.contact)}</p>
          <div class="meta">
            <span class="price-tag">GH₵ ${item.price}</span>
            <span class="tag">${escapeHtml(item.category)}</span>
          </div>
        </div>
      `).join("");
    }

    function addItem(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now(),
        name: document.getElementById("itemName").value.trim(),
        desc: document.getElementById("itemDesc").value.trim(),
        price: parseInt(document.getElementById("itemPrice").value),
        category: document.getElementById("itemCategory").value,
        contact: document.getElementById("itemContact").value.trim()
      };
      items.unshift(newItem);
      save();
      render(document.getElementById("searchBar").value);
      closeModal();
      e.target.reset();
    }

    function deleteItem(id) {
      if (!confirm("Delete this listing?")) return;
      items = items.filter(i => i.id !== id);
      save();
      render(document.getElementById("searchBar").value);
    }

    function openModal() {
      document.getElementById("modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    // Close modal if user taps outside it
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "modal") closeModal();
    });

    // Search
    document.getElementById("searchBar").addEventListener("input", (e) => {
      render(e.target.value);
    });

    // Prevent HTML injection
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial render
    render();
  </script>

</body>
</html>
